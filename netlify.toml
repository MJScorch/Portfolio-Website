[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

# The app resolves its own routes from the URL path, so unknown paths must
# still serve index.html rather than 404. Kept last so it never shadows the
# function routes or real files.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
